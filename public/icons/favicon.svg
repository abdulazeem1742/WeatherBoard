<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Sun -->
  <circle cx="340" cy="180" r="76" fill="url(#sun)" filter="url(#shadow)" />

  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="12" stroke-linecap="round" opacity="0.8">
    <line x1="340" y1="70" x2="340" y2="92" />
    <line x1="340" y1="268" x2="340" y2="290" />
    <line x1="230" y1="180" x2="252" y2="180" />
    <line x1="428" y1="180" x2="450" y2="180" />
    <line x1="262" y1="102" x2="278" y2="118" />
    <line x1="402" y1="242" x2="418" y2="258" />
    <line x1="262" y1="258" x2="278" y2="242" />
    <line x1="402" y1="118" x2="418" y2="102" />
  </g>

  <!-- Cloud -->
  <path
    d="M176 384h192c44.18 0 80-35.82 80-80 0-40.89-30.68-74.63-70.36-79.37C370.4 172.98 325.7 136 272 136c-59.65 0-109.13 45.47-115.34 103.74C119.8 244.62 96 273.53 96 308c0 41.98 34.02 76 76 76h4z"
    fill="url(#cloud)"
    filter="url(#shadow)"
  />
</svg>
